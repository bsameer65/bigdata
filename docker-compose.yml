version: "3.9"

networks:
  bridge:
    driver: bridge

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 32181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      bridge:
        aliases:
          - zookeeper
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      #KAFKA_ADVERTISED_HOST_NAME: 0.0.0.0
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:32181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # KAFKA_LISTENER_NAME: INSIDE-KAFKA
      #JMX_PORT: 9999
    networks:
      bridge:
        aliases:
          - kafka
    restart: unless-stopped

  backend:
    build:
      context: ./src/backend
    container_name: fastapi-backend
    environment:
      - KAFKA_SERVER=kafka:9092
    depends_on:
      - kafka
    ports:
      - "8000:8000"
    networks:
      - bridge
    restart: unless-stopped

  flink:
    build:
      context: ./src/components/flink
    container_name: flink-python-job
    environment:
      - JAVA_TOOL_OPTIONS=--add-opens java.base/java.net=ALL-UNNAMED
    volumes:
      - ./src/components/flink:/app
    working_dir: /app
    entrypoint: ["python", "processor.py"]
    depends_on:
      - kafka
    networks:
      - bridge
    restart: unless-stopped

  # Producers
  kafka-producer-1:
    build:
      context: ./src/components/kafka
    container_name: kafka-producer-1
    environment:
      PRODUCER_ID: 0
      TOTAL_PRODUCERS: 5
      KAFKA_SERVER: "kafka:9092"
    volumes:
      - ./src/components/radiation_data:/data
    depends_on:
      - kafka
    networks:
      - bridge
    restart: unless-stopped

  kafka-producer-2:
    build:
      context: ./src/components/kafka
    container_name: kafka-producer-2
    environment:
      PRODUCER_ID: 1
      TOTAL_PRODUCERS: 5
      KAFKA_SERVER: "kafka:9092"
    volumes:
      - ./src/components/radiation_data:/data
    depends_on:
      - kafka
    networks:
      - bridge
    restart: unless-stopped

  kafka-producer-3:
    build:
      context: ./src/components/kafka
    container_name: kafka-producer-3
    environment:
      PRODUCER_ID: 2
      TOTAL_PRODUCERS: 5
      KAFKA_SERVER: "kafka:9092"
    volumes:
      - ./src/components/radiation_data:/data
    depends_on:
      - kafka
    networks:
      - bridge
    restart: unless-stopped

  kafka-producer-4:
    build:
      context: ./src/components/kafka
    container_name: kafka-producer-4
    environment:
      PRODUCER_ID: 3
      TOTAL_PRODUCERS: 5
      KAFKA_SERVER: "kafka:9092"
    volumes:
      - ./src/components/radiation_data:/data
    depends_on:
      - kafka
    networks:
      - bridge
    restart: unless-stopped

  kafka-producer-5:
    build:
      context: ./src/components/kafka
    container_name: kafka-producer-5
    environment:
      PRODUCER_ID: 4
      TOTAL_PRODUCERS: 5
      KAFKA_SERVER: "kafka:9092"
    volumes:
      - ./src/components/radiation_data:/data
    depends_on:
      - kafka
    networks:
      - bridge
    restart: unless-stopped
