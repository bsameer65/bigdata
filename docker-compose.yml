version: "3.9"

networks:
  bridge:
    driver: bridge

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 32181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      bridge:
        aliases:
          - zookeeper

  kafka:
    image: confluentinc/cp-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      #KAFKA_ADVERTISED_HOST_NAME: 0.0.0.0
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:32181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENER_NAME: INSIDE-KAFKA
      #JMX_PORT: 9999
    networks:
      bridge:
        aliases:
          - kafka

  kafka-producer-1:
    image: kafka-producer-1
    build:
      context: ./src/components/kafka
    depends_on:
      - kafka
    environment:
      PRODUCER_ID: 0
      TOTAL_PRODUCERS: 5
      KAFKA_SERVER: "kafka:9092"
    volumes:
      - D:/TU Hamburg/Semester 2/Big data/project/radiation_data:/data
    networks:
      - bridge

  kafka-producer-2:
    image: kafka-producer-2
    build:
      context: ./src/components/kafka
    depends_on:
      - kafka
    environment:
      PRODUCER_ID: 1
      TOTAL_PRODUCERS: 5
      KAFKA_SERVER: "kafka:9092"
    volumes:
      - D:/TU Hamburg/Semester 2/Big data/project/radiation_data:/data
    networks:
      - bridge
  kafka-producer-3:
    image: kafka-producer-3
    build:
      context: ./src/components/kafka
    depends_on:
      - kafka
    environment:
      PRODUCER_ID: 2
      TOTAL_PRODUCERS: 5
      KAFKA_SERVER: "kafka:9092"
    volumes:
      - D:/TU Hamburg/Semester 2/Big data/project/radiation_data:/data
    networks:
      - bridge
  kafka-producer-4:
    image: kafka-producer-4
    build:
      context: ./src/components/kafka
    depends_on:
      - kafka
    environment:
      PRODUCER_ID: 3
      TOTAL_PRODUCERS: 5
      KAFKA_SERVER: "kafka:9092"
    volumes:
      - D:/TU Hamburg/Semester 2/Big data/project/radiation_data:/data
    networks:
      - bridge
  kafka-producer-5:
    image: kafka-producer-5
    build:
      context: ./src/components/kafka
    depends_on:
      - kafka
    environment:
      PRODUCER_ID: 4
      TOTAL_PRODUCERS: 5
      KAFKA_SERVER: "kafka:9092"
    volumes:
      - D:/TU Hamburg/Semester 2/Big data/project/radiation_data:/data
    networks:
      - bridge


